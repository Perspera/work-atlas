# 单量与作业进度看板：nginx 反向代理 + IP 白名单
# 安装：复制到 /etc/nginx/conf.d/work-atlas.conf，然后 nginx -t && systemctl reload nginx
#
# 应用本身只监听 127.0.0.1:18082，外部必须经过这里。
# 新增来源 IP：在 deny all; 之前再加一行 allow <IP>;
# 修改后执行：nginx -t && systemctl reload nginx

server {
    listen 18081;
    server_name _;

    # 本机健康检查
    allow 127.0.0.1;
    allow ::1;
    # 公司出口 IP（如办公网出口变更，需同步修改这一行）
    allow 183.233.190.250;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 实时推送：关闭缓冲并放宽读超时，否则页面收不到版本更新
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}
